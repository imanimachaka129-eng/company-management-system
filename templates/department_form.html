<!-- templates/department_form.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if department %}
                        <i class="fas fa-edit me-2"></i>Edit Department
                    {% else %}
                        <i class="fas fa-plus-circle me-2"></i>Add Department
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Department Name *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ department.name if department else '' }}" 
                               placeholder="e.g., Finance, Marketing, IT" required>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_departments') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>
                            {% if department %}Update{% else %}Create{% endif %} Department
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
